name: Build packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Windows package
        shell: pwsh
        run: .\packaging\build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: sound-via-lan-windows-x64
          path: packages/sound-via-lan-windows-x64.zip

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev libpulse-dev libgl1 zip
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Linux package
        run: bash packaging/build_linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: sound-via-lan-linux-x64
          path: packages/sound-via-lan-linux-x64.zip

  release:
    needs: [windows, linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Prepare assets
        run: |
          mkdir -p release
          cp artifacts/sound-via-lan-windows-x64/sound-via-lan-windows-x64.zip release/
          cp artifacts/sound-via-lan-linux-x64/sound-via-lan-linux-x64.zip release/
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          body: |
            Готовые пакеты Transmitter/Receiver.

            - Windows: распаковать ZIP, запустить `sound-transmitter\sound-transmitter.exe`
            - Linux: `unzip` → `./sound-receiver/sound-receiver` (нужны `libportaudio2`, `libpulse0`)

            Подробнее: [DISTRIBUTION.md](https://github.com/${{ github.repository }}/blob/main/DISTRIBUTION.md)
